name: validate-registry

# Validates the hub catalog and curated harnesses on every PR that touches
# them. Mirrors the local `python tools/validate-registry.py` +
# `validate-manifest.py` invocations so a broken catalog never merges.
#
# Fails the build when:
#   - hub/registry.yaml is malformed or references missing component dirs
#   - hub/harnesses.yaml references unknown components or has shape errors
#   - a fixture manifest under tests/fixtures/manifests/ regresses
#
# TODO: replace `python tools/...` invocations with `fdh validate-registry`
# and `fdh validate-manifest` once the Go implementation lands in the fdh repo.
on:
  push:
    branches: [main]
    paths:
      - "hub/registry.yaml"
      - "hub/harnesses.yaml"
      - "tools/validate-registry.py"
      - "tools/validate-manifest.py"
      - "tests/**"
      - ".github/workflows/validate-registry.yml"
  pull_request:
    paths:
      - "hub/registry.yaml"
      - "hub/harnesses.yaml"
      - "tools/validate-registry.py"
      - "tools/validate-manifest.py"
      - "tests/**"
      - ".github/workflows/validate-registry.yml"
  workflow_dispatch:

jobs:
  validate-registry-and-harnesses:
    name: Validate hub catalog + harnesses + manifest fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate hub/registry.yaml + hub/harnesses.yaml
        run: python tools/validate-registry.py

      - name: Validate manifest fixtures (valid + invalid)
        run: |
          echo "Validating expected-valid fixtures..."
          for f in minimal-valid explicit-components-valid extends-valid deprecated-profile-valid; do
            python tools/validate-manifest.py "tests/fixtures/manifests/$f.yaml"
          done
          echo "Validating expected-invalid fixtures (must fail)..."
          for f in unknown-harness-invalid empty-invalid unsupported-schema-invalid; do
            if python tools/validate-manifest.py "tests/fixtures/manifests/$f.yaml"; then
              echo "::error::expected $f to fail validation"; exit 1
            fi
          done
